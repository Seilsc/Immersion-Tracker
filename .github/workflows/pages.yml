name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (node --check)
        run: |
          for f in js/*.js browser-extension/*.js browser-extension/lib/*.js; do
            [ -e "$f" ] || continue
            node --check "$f" && echo "OK $f"
          done

      # Inyecta la config DENTRO de index.html (sin peticiones extra que puedan
      # fallar) y elimina el <script> del archivo local. Nunca se commitea.
      # Sin el secreto, la web se despliega igual pero sin login en la nube.
      - name: Inject firebase config inline
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node -e "const fs=require('fs');let h=fs.readFileSync('index.html','utf8');const c=process.env.FIREBASE_CONFIG_JSON;console.log('secret length:',(c||'').length);if(c){if(!h.includes('/*__FIREBASE_CONFIG_JSON__*/null')){console.error('PLACEHOLDER NOT FOUND');process.exit(1);}const safe=String(c).replace(/<\//g,'<\\/');h=h.replace('/*__FIREBASE_CONFIG_JSON__*/null',()=>safe);h=h.replace(/<script src=\"js\/firebase-config\.js\"><\/script>\n?/,'');h=h.replace('</body>',()=>'<!-- deploy ${GITHUB_SHA} run ${GITHUB_RUN_ID} -->\n</body>');fs.writeFileSync('index.html',h);if(h.includes('__FIREBASE_CONFIG_JSON__')){console.error('INJECTION FAILED');process.exit(1);}console.log('config injected inline, external tag removed');}else{console.log('No FIREBASE_CONFIG_JSON secret: deploying without cloud login');}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
